# Builds Hanabi Studio for Linux and Windows 10/11 on every push, checks the dependencies for
# known security problems, and attaches zip files to a GitHub release when a tag like v0.1.0 is
# pushed.
#
# Security: everything runs with read-only access; only the final release job (tags only) may
# write, and it runs no project code. Third-party actions are pinned to exact commits.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check dependencies against the RustSec advisory database
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: hanabi-studio
          - os: windows-2022
            name: windows-x86_64
            exe: hanabi-studio.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/hanabi-studio
          cp target/release/${{ matrix.exe }} dist/hanabi-studio/
          cp LICENSE README.md THIRD-PARTY.md SECURITY.md dist/hanabi-studio/
          cp -r samples dist/hanabi-studio/
          rm -f dist/hanabi-studio/samples/*.autosave.hproj
          cd dist && 7z a ../hanabi-studio-${{ matrix.name }}.zip hanabi-studio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hanabi-studio-${{ matrix.name }}
          path: hanabi-studio-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
