[package]
name = "hanabi-studio"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Moxier/hanabi-studio"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
epaint = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_glow = "0.37"
glow = "0.17"
glam = { version = "0.30", features = ["serde"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds", "gif"] }
rapier3d = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
rayon = "1"
parking_lot = "0.12"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
